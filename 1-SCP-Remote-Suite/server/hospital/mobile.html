<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131b" media="(prefers-color-scheme: dark)">
<title>SCP-Remote</title>
<!-- Added to the home screen this opens as its own window, with the hospital logo, and
     scope "/" keeps the remote desktop page inside it instead of bouncing out to a browser tab. -->
<link rel="manifest" href="scp-mobile.webmanifest">
<link rel="apple-touch-icon" href="images/scp-logo.png">
<link rel="icon" href="images/scp-logo.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SCP-Remote">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles/scp-mobile.css?v=20261013-compact">
</head>
<body>
<header>
  <div class="header-inner">
  <div class="brand">
    <img src="images/scp-logo.png" alt="" width="40" height="40">
    <div><b>SCP-Remote</b><small>HOSPITAL IT</small></div>
  </div>
  <div class="header-tools">
    <select id="language" aria-label="Language"><option value="th">ไทย</option><option value="en">English</option></select>
    <!-- The way to the full MeshCentral site. Device groups, moving a computer between wards
         and adding an account all live there, and with the old "full site" link gone this is
         the only door left. The script fills in the href, because this page is served at
         <root>m and a bare "?m=0" would reload this page instead of leaving it. -->
    <a id="settings" class="icon-button" href="?m=0&amp;mobile=0" title="ตั้งค่าทั้งหมด" aria-label="ตั้งค่าทั้งหมด">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </a>
  </div>
  </div>
</header>

<main id="workspace">
  <section class="content">
    <div class="heading">
      <div>
        <span class="eyebrow"><span class="workspace-mark"></span>REMOTE WORKSPACE</span>
        <h1 id="heading">เลือกเครื่องเพื่อรีโมต</h1>
        <p id="hint">ค้นหาเครื่อง เลือกหน่วยงาน แล้วขอเชื่อมต่อ</p>
      </div>
      <button id="refresh" class="icon-button" aria-label="รีเฟรช" title="รีเฟรช">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-2L20 8M4 16l2.3 3A7 7 0 0 0 17.9 17"/></svg>
        <span data-label class="visually-hidden">รีเฟรช</span>
      </button>
    </div>

    <div class="fleet-summary">
      <article><strong id="totalCount">—</strong><span id="totalLabel">ทั้งหมด</span></article>
      <article><strong id="onlineCount">—</strong><span id="onlineLabel">ออนไลน์</span></article>
      <article><strong id="roomsCount">—</strong><span id="roomsLabel">หน่วยงาน</span></article>
    </div>

    <div class="filter-panel">
      <div class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="search" type="search" aria-label="ค้นหาชื่อเครื่อง หรือ IP" placeholder="ค้นหาชื่อเครื่อง หรือ IP" autocomplete="off">
      </div>
      <div class="filter-heading">
        <h3 id="roomTitle">หน่วยงาน</h3>
        <select id="roomSelect" aria-labelledby="roomTitle"><option value="">ทุกหน่วยงาน</option></select>
        <label class="online-toggle"><input id="onlineOnly" type="checkbox"><span id="onlineOnlyLabel">ออนไลน์เท่านั้น</span></label>
      </div>
      <div id="rooms" role="group" aria-labelledby="roomTitle"></div>
    </div>

    <div class="list-heading">
      <div><h2 id="devicesTitle">รายชื่อเครื่อง</h2><span id="resultCount"></span></div>
      <div class="view-switch" role="group" aria-label="มุมมอง">
        <button id="listView" aria-pressed="true" aria-label="รายชื่อ" title="รายชื่อ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M3 6h1M3 12h1M3 18h1"/></svg><span data-label>รายชื่อ</span></button>
        <button id="mapView" aria-pressed="false" aria-label="ผังห้อง" title="ผังห้อง"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span data-label>ผังห้อง</span></button>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="mapNote" hidden></p>
    <div id="devices"></div>
    <div class="consent-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></svg><p id="consentNote">ทุกครั้งต้องได้รับอนุญาตจากเครื่องปลายทาง</p></div>
  </section>
</main>

<footer id="footer">SCP-Remote · Hospital IT</footer>
<template id="icon-computer"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M8 21h8M12 16v5M7 7h10"/></svg></template>
<template id="icon-arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></template>
<template id="icon-printer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V8h16v9h-3M7 14h10v7H7zM16 11h1"/></svg></template>
<script src="scripts/scp-mobile.js?v=20261013-compact"></script>
</body>
</html>
