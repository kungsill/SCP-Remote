<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>SCP-Remote</title>
<link rel="stylesheet" href="styles/scp-mobile.css?v=20260923-2">
</head>
<body>
<header>
  <div><b>SCP-Remote</b><small>สุขภาพดิจิทัล · Hospital IT</small></div>
  <div class="header-tools">
    <a id="full" href=".">เว็บเต็ม</a>
    <select id="language" aria-label="Language"><option value="th">ไทย</option><option value="en">English</option></select>
  </div>
</header>

<main id="workspace">
  <section class="content">
    <div class="heading">
      <div>
        <span class="eyebrow">REMOTE DESKTOP</span>
        <h1 id="heading">เลือกเครื่องที่ต้องการรีโมต</h1>
        <p id="hint">ค้นหาตามชื่อเครื่องหรือ IP แล้วส่งคำขออนุญาต</p>
      </div>
      <button id="refresh">รีเฟรช</button>
    </div>

    <div class="fleet-summary">
      <article><span id="totalLabel">เครื่องทั้งหมด</span><strong id="totalCount">—</strong></article>
      <article><span id="onlineLabel">ออนไลน์</span><strong id="onlineCount">—</strong></article>
      <article><span id="roomsLabel">ห้อง / หน่วยงาน</span><strong id="roomsCount">—</strong></article>
    </div>

    <h3 id="roomTitle">ห้อง / หน่วยงาน</h3>
    <div id="rooms" role="group" aria-labelledby="roomTitle"></div>

    <div class="tools">
      <input id="search" type="search" placeholder="ค้นหาชื่อเครื่อง หรือ IP" autocomplete="off">
      <div>
        <button id="listView" aria-pressed="true">รายชื่อ</button>
        <button id="mapView" aria-pressed="false">ผังห้อง</button>
      </div>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
    <p id="mapNote" hidden></p>
    <div id="devices"></div>
    <p id="consentNote">ทุกครั้งต้องได้รับอนุญาตจากเครื่องปลายทาง</p>
  </section>
</main>

<footer id="footer">SCP-Remote · Hospital IT</footer>
<script src="scripts/scp-mobile.js?v=20260923-2"></script>
</body>
</html>
